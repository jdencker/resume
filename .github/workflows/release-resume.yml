name: CI - Release Resume

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # need full history for changelog/tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Resume via Docker
        run: |
          make docker

      - name: Copy PDF into dist/
        run: |
          mkdir -p dist
          cp build/resume.pdf dist/resume.pdf

      - name: Bump VERSION
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh "${{ inputs.bump }}"
          echo "NEW_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Generate CHANGELOG
        run: |
          chmod +x scripts/generate-changelog.sh
          scripts/generate-changelog.sh

      - name: Create Release Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): v${{ env.NEW_VERSION }}"
          branch: "release/v${{ env.NEW_VERSION }}"
          title: "chore(release): v${{ env.NEW_VERSION }}"
          body: |
            Automated release PR for **v${{ env.NEW_VERSION }}**.

            This PR includes:
            - Updated VERSION
            - Regenerated CHANGELOG.md
            - Updated dist/resume.pdf
          labels: release
          base: main
          delete-branch: true

      - name: Create tag for version
        run: |
          TAG="v${NEW_VERSION}"
          SHA="${{ steps.create_pr.outputs.pull-request-head-sha }}"
          if [ -z "$SHA" ]; then
            echo "No PR commit SHA found; skipping tag."
            exit 0
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists; skipping."
          else
            git tag "${TAG}" "${SHA}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release for major versions
        if: ${{ inputs.bump == 'major' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          body: |
            Release v${{ env.NEW_VERSION }}

            See CHANGELOG.md for details.
