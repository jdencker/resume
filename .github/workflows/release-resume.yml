name: Release resume

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for changelog/tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Resume via Docker
        run: |
          make docker

      - name: Copy PDF into dist/
        run: |
          mkdir -p dist
          cp build/resume.pdf dist/resume.pdf

      - name: Bump VERSION
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh "${{ inputs.bump }}"
          echo "NEW_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Generate CHANGELOG
        run: |
          chmod +x scripts/generate-changelog.sh
          scripts/generate-changelog.sh

      - name: Create Release Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): v${{ env.NEW_VERSION }}"
          branch: "release/v${{ env.NEW_VERSION }}"
          title: "chore(release): v${{ env.NEW_VERSION }}"
          body: |
            Automated release PR for **v${{ env.NEW_VERSION }}**.

            This PR includes:
            - Updated VERSION
            - Regenerated CHANGELOG.md
            - Updated dist/resume.pdf
          labels: release
          base: main
          delete-branch: true
