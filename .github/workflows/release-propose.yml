name: Release - Propose Résumé Version

# Phase 1 of the release process: prepare a new résumé edition and open a PR.
# This job NEVER tags or publishes — that happens in release-publish.yml only
# after this PR is merged to main, so a version can never be published from an
# unmerged branch.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      summary:
        description: "One-line summary of this résumé edition (used as the release notes)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # full history so the version bump sees prior tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build résumé via Docker
        run: |
          make docker

      - name: Lint the built résumé
        run: |
          make lint PYTHON=python

      - name: Copy PDF into dist/
        run: |
          mkdir -p dist
          cp build/resume.pdf dist/resume.pdf

      - name: Bump VERSION
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh "${{ inputs.bump }}"
          echo "NEW_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Write release notes
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          mkdir -p release-notes
          NOTES="release-notes/v${NEW_VERSION}.md"
          printf '# Résumé v%s\n\n%s\n' "${NEW_VERSION}" "${SUMMARY}" > "${NOTES}"
          echo "Wrote ${NOTES}"

      - name: Create release pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): v${{ env.NEW_VERSION }}"
          branch: "release/v${{ env.NEW_VERSION }}"
          title: "chore(release): v${{ env.NEW_VERSION }}"
          body: |
            Proposed résumé release **v${{ env.NEW_VERSION }}**.

            ${{ inputs.summary }}

            This PR updates:
            - `VERSION`
            - `dist/resume.pdf`
            - `release-notes/v${{ env.NEW_VERSION }}.md`

            Merging to `main` triggers `release-publish.yml`, which tags
            `v${{ env.NEW_VERSION }}` and creates the GitHub Release.
          labels: release
          base: main
          delete-branch: true
