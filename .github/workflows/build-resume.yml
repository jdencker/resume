name: CI - Build and Lint Resume

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build resume via Docker
        run: |
          make docker

      - name: Run unified lint (codespell + pyspellchecker + cvlint)
        run: |
          make lint PYTHON=python

      - name: Upload resume.pdf artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-pdf
          path: build/resume.pdf

  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.16

      - name: Lint Python tooling with ruff
        run: |
          ruff check scripts

  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # need PR commit range

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x hooks/commit-msg
          fail=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            tmp=$(mktemp)
            git log -1 --format=%B "$sha" > "$tmp"
            if ! ./hooks/commit-msg "$tmp"; then
              echo "::error::Commit $sha failed commit-msg lint"
              fail=1
            fi
          done
          exit $fail
